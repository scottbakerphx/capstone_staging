cat << 'EOF' > .github/workflows/deploy.yml
name: CI/CD Pipeline - Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Run Tests, Security Scan & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Unit Tests
        run: go test -v -cover ./...

      - name: Run GoSec Security Scan
        uses: securego/gosec@master
        with:
          args: ./...

  deploy:
    name: Build & Deploy to Environment
    needs: test-and-build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & GCP Configuration
        id: env-config
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          PROJECT_ID="phx-platform-lab"

          if [[ "$REPO_NAME" == *"_dev" ]]; then
            echo "SERVICE_NAME=go-gateway-dev" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/22197185798/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=sa-capstone-dev@${PROJECT_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/${PROJECT_ID}/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=${PROJECT_ID}" >> $GITHUB_ENV

          elif [[ "$REPO_NAME" == *"_staging" ]]; then
            echo "SERVICE_NAME=go-gateway-staging" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/22197185798/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=sa-capstone-staging@${PROJECT_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/${PROJECT_ID}/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=${PROJECT_ID}" >> $GITHUB_ENV

          elif [[ "$REPO_NAME" == *"_production" ]]; then
            echo "SERVICE_NAME=go-gateway-prod" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/22197185798/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=sa-capstone-prod@${PROJECT_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/${PROJECT_ID}/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=${PROJECT_ID}" >> $GITHUB_ENV

          else
            echo "Error: Unrecognized repository name ($REPO_NAME). Must end in _dev, _staging, or _production"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --project=${{ env.RUN_PROJECT }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --quiet
EOF
