name: CI/CD Pipeline - Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        run: go test -v -cover ./...

  deploy:
    name: Build & Deploy to Environment
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & GCP Configuration
        id: env-config
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          
          if [[ "$REPO_NAME" == *"_dev" ]]; then
            echo "SERVICE_NAME=go-gateway-dev" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/265237128712/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=github-actions-sa@capstone-dev-sb26.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/capstone-dev-sb26/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=capstone-dev-sb26" >> $GITHUB_ENV
            
          elif [[ "$REPO_NAME" == *"_staging" ]]; then
            echo "SERVICE_NAME=go-gateway-staging" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/265237128712/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=github-actions-sa@capstone-dev-sb26.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/capstone-dev-sb26/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=capstone-dev-sb26" >> $GITHUB_ENV
            
          elif [[ "$REPO_NAME" == *"_production" ]]; then
            echo "SERVICE_NAME=go-gateway-prod" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/1076538183807/locations/global/workloadIdentityPools/shared-github-pool/providers/shared-github-provider" >> $GITHUB_ENV
            echo "SA_EMAIL=shared-ci-sa@capstone-shared-sb26.iam.gserviceaccount.com" >> $GITHUB_ENV
            echo "REGISTRY=us-central1-docker.pkg.dev/capstone-shared-sb26/platform-repo" >> $GITHUB_ENV
            echo "RUN_PROJECT=capstone-prod-sb26" >> $GITHUB_ENV
            
          else
            echo "Error: Unrecognized repository name ($REPO_NAME). Must end in _dev, _staging, or _production"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_URI="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --project=${{ env.RUN_PROJECT }} \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --quiet
