steps:
  # Step 1: Run Go unit tests on Go 1.26
  - name: 'golang:1.26-alpine'
    entrypoint: 'go'
    args: ['test', './...']

  # Step 2: Build the Go gateway container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/platform-repo/go-gateway:$SHORT_SHA',
      '.'
    ]

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/$PROJECT_ID/platform-repo/go-gateway:$SHORT_SHA'
    ]

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/platform-repo/go-gateway:$SHORT_SHA'
